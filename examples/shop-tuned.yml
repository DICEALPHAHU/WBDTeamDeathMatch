      # 完整展示物品数据，优先读取。由 /wbd shopedit 自动生成，通常不要手动修改。
      display-data: "bukkit-object:"
      # 实际发放给玩家的物品摘要；如果下方 give-data 存在，实际发放会优先使用完整数据。
      give:
        material: LRTACTICAL_THROWABLE
      # 发放到背包槽位。小于 0 或槽位非法时会自动 addItem。
      give-slot: 3
      # 完整发放物品数据，优先读取。由 /wbd shopedit 自动生成，通常不要手动修改。
      give-data: "bukkit-object:"

