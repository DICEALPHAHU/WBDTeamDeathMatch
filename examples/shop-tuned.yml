# WarZBombDefuse 商店配置文件
# 说明：
# 1. 插件不内置枪械逻辑，商店可发放原版物品，也可执行 TACZ/Vault/礼包插件命令。
# 2. shop.items 是旧版兼容/公共商品；旧配置无需迁移，仍会按 team 字段正常过滤。
# 3. shop.team-shops.T/CT.items 是阵营专属商品；同 ID 商品会覆盖上方公共商品，方便两边价格/展示/命令完全不同。
# 4. 可使用 /wbd shopedit 编辑公共商城，/wbd shopedit T 或 /wbd shopedit CT 编辑指定阵营商城。
#    编辑器内请使用普通鼠标点击摆放商品；Shift、数字键、拖拽铺货、一键整理等快捷操作会被拦截。
# 5. page 是商品所在页码；slot 是该页内槽位。旧配置不写 page 时默认第 1 页。
# 6. click-commands 是点击购买成功后执行的指令，支持变量 %player%、%uuid%、%item%。
#    command-sender 可填 console 或 player，默认 console。旧字段 commands 仍兼容。
#    command-repeat 可让一次购买重复执行命令，范围 1-64；旧配置默认 1 次。
# 7. close-after-click 为 true 时，玩家点击该按钮后会自动关闭商店。
# 8. team 可填 T、CT、ANY。ANY 表示双方都可购买；阵营专属商品不写时默认当前阵营。
# 9. limit-per-round 控制每名玩家每回合最多购买次数，0 表示不限制，1 表示每回合一次。
# 10. display-data/give-data 通常不要手动修改；日常只需要改 page、slot、team、price、limit-per-round、permission、click-commands 等字段。

shop:
  # 玩家每回合获得的商店打开物品。
  open-item:
    material: EMERALD
    name: "&a装备菜单"
    slot: 8

  # 商店菜单大小，必须是 9 的倍数，范围 9-54。
  size: 54

  # 公共/旧版商店总页数。阵营专属商城可在 team-shops.<T|CT>.pages 单独覆盖。
  pages: 3

  # 公共/旧版商店标题。支持变量：%page%、%pages%、%team%、%team_name%。
  title: "&8[&6WBD&8] &f爆破模式商店 &7%page%/%pages%"

  # 翻页按钮设置。对应槽位会被上一页/页码/下一页按钮占用。
  navigation:
    previous-slot: 45
    info-slot: 49
    next-slot: 53
    previous-item:
      material: ARROW
      name: "&e上一页"
      lore:
        - "&7点击返回第 &f%page%/%pages% &7页的上一页。"
    next-item:
      material: ARROW
      name: "&e下一页"
      lore:
        - "&7点击前往第 &f%page%/%pages% &7页的下一页。"
    info-item:
      material: PAPER
      name: "&6第 %page% / %pages% 页"
      lore:
        - "&7商店支持多页商品。"

  # 公共/旧版商品列表。没有配置 team-shops 时，玩家只使用这里的商品。
  items:
    M67Grenade:
      # 商品所在页码。
      page: 1
      # 菜单中的槽位。
      slot: 2
      # 限制购买队伍。ANY 表示双方都可购买；阵营专属商品通常保持当前阵营即可。
      team: ANY
      # 价格。购买成功后从插件内置金钱扣除。
      price: 300
      # 每名玩家每回合最多购买次数。0 表示不限制，1 表示每回合一次。
      limit-per-round: 1
      # 购买该商品所需权限。为空则不限制。
      permission: ""
      # 菜单里展示的物品摘要，方便人工查看；如果下方 display-data 存在，实际展示会优先使用完整数据。
      display:
        material: LRTACTICAL_THROWABLE
      # 完整展示物品数据，优先读取。由 /wbd shopedit 自动生成，通常不要手动修改。
      display-data: "bukkit-object:"
      # 实际发放给玩家的物品摘要；如果下方 give-data 存在，实际发放会优先使用完整数据。
      give:
        material: LRTACTICAL_THROWABLE
      # 发放到背包槽位。小于 0 或槽位非法时会自动 addItem。
      give-slot: 3
      # 完整发放物品数据，优先读取。由 /wbd shopedit 自动生成，通常不要手动修改。
      give-data: "bukkit-object:"

    Molotov:
      # 商品所在页码。
      page: 1
      # 菜单中的槽位。
      slot: 3
      # 限制购买队伍。ANY 表示双方都可购买；阵营专属商品通常保持当前阵营即可。
      team: ANY
      # 价格。购买成功后从插件内置金钱扣除。
      price: 600
      # 每名玩家每回合最多购买次数。0 表示不限制，1 表示每回合一次。
      limit-per-round: 1
      # 购买该商品所需权限。为空则不限制。
      permission: ""
      # 菜单里展示的物品摘要，方便人工查看；如果下方 display-data 存在，实际展示会优先使用完整数据。
      display:
