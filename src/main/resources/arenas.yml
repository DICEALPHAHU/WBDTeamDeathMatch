# ============================================================
#  WBDTeamDeathmatch 竞技场配置
# ============================================================
# 坐标格式与 WarZBombDefuse 的 arenas.yml 完全一致：
#     world,x,y,z,yaw,pitch
# 边界格式：
#     world / min: "x,y,z" / max: "x,y,z"
#
# 为什么要对齐 WBD 的格式：场地坐标是整件事里最容易配错、也最费时间的部分。
# 服主可以先用 /wbd create <id> 和 /wbd setup <id> 把点量好，
# 再用 /tdm import <wbd竞技场id> 把坐标原样导进本文件，不必手抄一遍。
#
# ⚠️ 被本模式使用的场地，请务必在 WarZBombDefuse 侧保持 enabled: false。
#    只要 WBD 启用了同一个场地，它的回合循环（倒计时、发炸弹、全灭判负、
#    强制旁观）就会和死斗的无限复活直接打架。启动时本插件会检查并告警。
#
# 每个场地都可以覆盖 config.yml 里的部分玩法参数（target-kills 等），
# 不写的字段就沿用全局配置。
# ============================================================

arenas:

  # 示例场地。填好坐标并把 enabled 改成 true 即可使用。
  tdm_demo:
    # 是否启用。未完成配置前保持 false。
    enabled: false

    # 场地显示名，命令与播报里会用到。
    name: "死斗示例场地"

    # 最少开局人数 / 最大人数（覆盖 config.yml 的全局值，可删）
    min-players: 2
    max-players: 20

    # 等待大厅位置。加入等待、比赛重置时会传送到这里。
    lobby: "world,0.5,80.0,0.5,0,0"

    # 场地边界。只用于限制玩家活动范围（越界的人会被拉回来）。
    boundary:
      world: "world"
      min: "-80,0,-80"
      max: "80,255,80"

    # T 方出生点列表。可配置多个，插件会随机或轮换选取。
    t-spawns:
      - "world,-10.5,80.0,0.5,90,0"

    # CT 方出生点列表。
    ct-spawns:
      - "world,10.5,80.0,0.5,-90,0"

    # 购买区。玩家必须站在**自己阵营**的购买区内才能打开商店。
    #
    # 格式与 WarZBombDefuse 的 arenas.yml 完全一致：
    #   world,x,y,z,yaw,pitch,radius
    # 最后一位是球体半径（方块）。yaw 与 pitch 对球形区域没有意义，
    # 保留只是为了让你能从 WBD 那份配置里直接抄一行过来。
    #
    # 不配置的阵营不受位置限制（与 WBD 的「留空表示任意位置都可购买」一致）。
    # 想让「没配也不许买」生效，把 config.yml 的 shop.buy-zone-required 打开。
    #
    # 建议把购买区放在各自出生点附近，半径 6~10：太小会卡住复活后想换装备的人，
    # 太大就等于回到「哪里都能买」。
    buy-zones:
      t:
        - "world,-10.5,80.0,0.5,90,0,8.0"
      ct:
        - "world,10.5,80.0,0.5,-90,0,8.0"

    # 以下均为可选覆盖项，删掉即沿用 config.yml 的全局值。
    # target-kills: 50
    # time-limit-seconds: 900
    # countdown-seconds: 10
    # end-delay-seconds: 15
    # auto-restart: true

    # 是否**不**结算段位。默认 false，即这个场地参与排位。
    #
    # 训练场、娱乐场、活动场把它设成 true：这些场地上的输赢不影响玩家段位，
    # 否则新手在这里练枪会掉段，活动里乱打也会掉段。
    #
    # 判定发生在比赛结束时（结算那一刻读的是场地当前的值），
    # 所以比赛打到一半改它，影响的也是这一局的结算。
    # unrank: true

    # 比赛结束时放烟花的位置列表，可为空。
    fireworks: []
